<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt / Thermal Print</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Mono', 'Courier New', monospace; background: #e8e4de; color: #2a2a2a; overflow-x: hidden;
    display: flex; justify-content: center; }

  .receipt-wrapper {
    width: 100%; max-width: 380px; background: #faf8f4; position: relative;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  /* Torn top edge */
  .receipt-wrapper::before {
    content: ''; position: absolute; top: -8px; left: 0; right: 0; height: 16px; z-index: 2;
    background: linear-gradient(135deg, #faf8f4 33.33%, transparent 33.33%) 0 0,
      linear-gradient(225deg, #faf8f4 33.33%, transparent 33.33%) 0 0;
    background-size: 12px 16px; background-position: top;
    background-repeat: repeat-x; background-color: transparent;
  }

  /* Faded edges */
  .receipt-wrapper::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 8px 0 12px -8px rgba(0,0,0,0.06), inset -8px 0 12px -8px rgba(0,0,0,0.06);
  }

  .hero { padding: 2rem 1.5rem 1rem; position: relative; }

  /* Thermal print fade effect */
  .fade-text { opacity: 0.65; }

  nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem;
    border-bottom: 1px dashed #bbb; margin-bottom: 1rem; }
  nav .logo { font-weight: 600; font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; }
  nav ul { list-style: none; display: flex; gap: 0.8rem; }
  nav a { color: #888; text-decoration: none; font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s; }
  nav a:hover { color: #2a2a2a; }

  .store-header { text-align: center; margin-bottom: 1rem; }
  .store-header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 0.3rem; }
  .store-header .addr { font-size: 0.6rem; color: #888; letter-spacing: 1px; }

  .divider { border: none; border-top: 1px dashed #bbb; margin: 0.8rem 0; }
  .divider-double { border: none; border-top: 2px double #bbb; margin: 0.8rem 0; }

  .line-item { display: flex; justify-content: space-between; font-size: 0.7rem; padding: 0.15rem 0; }
  .line-item .desc { flex: 1; }
  .line-item .price { text-align: right; min-width: 60px; }

  .total-line { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0; }

  .subtitle { font-size: 0.65rem; color: #888; text-align: center; margin: 0.8rem 0; line-height: 1.6; }

  .cta { display: block; width: 100%; padding: 0.6rem; background: #2a2a2a; color: #faf8f4;
    font-family: inherit; font-size: 0.7rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    border: none; cursor: pointer; transition: background 0.3s; text-align: center; margin-top: 0.8rem; }
  .cta:hover { background: #444; }

  /* Barcode */
  .barcode { display: flex; justify-content: center; gap: 1px; margin: 1rem 0 0.5rem; }
  .barcode span { display: block; height: 30px; background: #2a2a2a; }
  .barcode-num { text-align: center; font-size: 0.55rem; color: #888; letter-spacing: 3px; }

  /* Timestamp */
  .timestamp { text-align: center; font-size: 0.55rem; color: #aaa; margin-top: 0.5rem; }

  /* Components Section */
  .components { padding: 1rem 1.5rem 2rem; }
  .components h2 { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 1rem;
    text-align: center; color: #888; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
  .btn { font-family: inherit; padding: 0.4rem 1rem; font-size: 0.65rem; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s; }
  .btn-dark { background: #2a2a2a; color: #faf8f4; border: none; }
  .btn-dark:hover { background: #444; }
  .btn-outline { background: transparent; border: 1px solid #2a2a2a; color: #2a2a2a; }
  .btn-outline:hover { background: #2a2a2a; color: #faf8f4; }
  .btn-faded { background: #e8e4de; color: #888; border: none; }
  .btn-faded:hover { background: #d8d4ce; }

  .card {
    border: 1px dashed #bbb; padding: 1rem; margin-bottom: 1.5rem;
  }
  .card h3 { font-size: 0.7rem; font-weight: 600; margin-bottom: 0.3rem; letter-spacing: 2px; text-transform: uppercase; }
  .card p { font-size: 0.65rem; color: #888; line-height: 1.6; }

  .input-group { margin-bottom: 1.5rem; }
  .input-group input {
    width: 100%; padding: 0.5rem 0.8rem; background: transparent;
    border: none; border-bottom: 1px solid #bbb; color: #2a2a2a;
    font-family: inherit; font-size: 0.7rem; outline: none; letter-spacing: 1px; transition: border-color 0.3s;
  }
  .input-group input:focus { border-bottom-color: #2a2a2a; }
  .input-group input::placeholder { color: #ccc; }

  .palette { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  .swatch { width: 40px; height: 40px; border: 1px solid #ddd; position: relative; cursor: pointer; transition: transform 0.3s; }
  .swatch:hover { transform: scale(1.1); }
  .swatch span { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 0.45rem; color: #aaa; white-space: nowrap; }

  .receipt-footer { text-align: center; font-size: 0.55rem; color: #bbb; padding: 1rem 0 0.5rem; letter-spacing: 2px; }


/* A/B Toggle */
.side-toggle{position:fixed;top:12px;right:12px;z-index:99999;display:flex;background:rgba(0,0,0,.88);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(0,0,0,.5);font-family:system-ui,sans-serif}
.side-toggle button{padding:6px 16px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:0 0;color:rgba(255,255,255,.45);font-family:inherit;transition:all .2s;letter-spacing:.5px}
.side-toggle button.active{background:rgba(129,140,248,.25);color:#818CF8}
.side-toggle button:hover:not(.active){color:rgba(255,255,255,.8)}
.a-side{display:none}.b-side{display:block}
body.show-a .a-side{display:block}body.show-a .b-side{display:none}

/* B-Side: Receipt / Thermal Print */
.b-side{background:#FAF8F4;color:#2C2C2C;font-family:'IBM Plex Mono','Courier New',monospace;line-height:1.6;}
.b-side *{box-sizing:border-box;margin:0;padding:0}
.bh{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;border-bottom:1px dashed #CCCCCC;position:sticky;top:0;z-index:100;background:#FAF8F4;}
.bh .logo{font-weight:700;font-size:1.15rem;color:#2C2C2C;;;}
.bh nav{display:flex;gap:1.5rem}
.bh nav a{color:#999999;text-decoration:none;font-size:.85rem;transition:color .2s;}
.bh nav a:hover{color:#2C2C2C}
.bhero{min-height:auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:3rem 2rem;padding:3rem 2rem}
.bhero-inner{max-width:640px}
.bhero-tag{font-size:.8rem;color:#2C2C2C;text-transform:uppercase;letter-spacing:3px;margin-bottom:1rem;font-weight:600}
.bhero h1{font-size:clamp(2.5rem,6vw,4rem);font-weight:800;line-height:1.08;margin-bottom:1.5rem;letter-spacing:-.03em;font-family:'IBM Plex Mono','Courier New',monospace}
.bhero p{font-size:1.05rem;color:#999999;max-width:480px;margin:0 auto 2rem;line-height:1.7}
.bhero-btns{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
.bbtn{font-family:'IBM Plex Mono','Courier New',monospace;padding:.8rem 2rem;border-radius:0px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;;}
.bbtn-p{background:#2C2C2C;color:#FAF8F4;}.bbtn-p:hover{opacity:.9;transform:translateY(-1px)}
.bbtn-s{background:transparent;color:#2C2C2C;border:1.5px solid #999999;}.bbtn-s:hover{border-color:#2C2C2C;color:#2C2C2C}
.bsec{padding:5rem 2rem;border-top:1px dashed #CCCCCC}
.bcon{max-width:380px;margin:0 auto}
.bst{font-size:.75rem;text-transform:uppercase;letter-spacing:3px;color:#2C2C2C;text-align:center;margin-bottom:.5rem;font-weight:600}
.bsh{font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:3rem;letter-spacing:-.02em;font-family:'IBM Plex Mono','Courier New',monospace}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.bcard{background:transparent;border:1px dashed #CCCCCC;border-radius:0px;padding:2rem;box-shadow:none;transition:transform .2s;}
.bcard:hover{transform:translateY(-3px)}
.bcard h3{font-size:1.05rem;margin-bottom:.5rem;font-weight:600}
.bcard p{font-size:.88rem;color:#999999;line-height:1.6}
.bcard-icon{width:40px;height:40px;border-radius:6px;background:#EEEEEE;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:1.2rem;color:#2C2C2C}
.bmets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2rem;text-align:center}
.bmet-v{font-size:2.2rem;font-weight:800;color:#2C2C2C;line-height:1;font-family:inherit;}
.bmet-l{font-size:.78rem;color:#999999;margin-top:.25rem;text-transform:uppercase;letter-spacing:1px}
.bquote{max-width:580px;margin:0 auto;text-align:center}
.bquote blockquote{font-size:1.15rem;line-height:1.7;color:#2C2C2C;margin-bottom:.75rem;font-family:inherit;font-style:normal}
.bquote cite{font-size:.85rem;color:#999999;font-style:normal}
.bfoot{padding:2.5rem 2rem;border-top:1px dashed #CCCCCC;text-align:center}
.bfoot .logo{font-weight:700;color:#2C2C2C;margin-bottom:.75rem;font-size:1.1rem}
.bfoot nav{margin-bottom:.75rem}
.bfoot nav a{color:#999999;text-decoration:none;font-size:.8rem;margin:0 .75rem}
.bfoot nav a:hover{color:#2C2C2C}
.bfoot small{font-size:.75rem;color:#999999}
.bgrid{display:block}
.bcard{border:none;border-bottom:1px dashed #CCC;padding:1rem 0;border-radius:0}
.bcard-icon{display:none}
.bcard h3{display:inline}
.bcard p{display:inline;float:right}
.bmets{grid-template-columns:repeat(2,1fr)}
@media(max-width:768px){.bh nav{display:none}.bhero{min-height:auto;padding:3rem 2rem;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="side-toggle"><button onclick="document.body.classList.add('show-a');this.classList.add('active');this.nextElementSibling.classList.remove('active')" id="btn-a">A Side</button><button onclick="document.body.classList.remove('show-a');this.classList.add('active');this.previousElementSibling.classList.remove('active')" id="btn-b" class="active">B Side</button></div>
<div class="a-side">
<div class="receipt-wrapper">
    <section class="hero">
      <nav>
        <div class="logo">RECEIPT.CO</div>

      <div class="line-item fade-text"><span class="desc">DISCOUNT (MEMBER)</span><span class="price">-$7.20</span></div>
      <hr class="divider">
      <div class="total-line"><span>TOTAL</span><span>$64.80</span></div>

      <hr class="divider">
      <p class="subtitle">Thank you for shopping with us.<br>Design beautifully. Print thermally.</p>
      <button class="cta">Print Another</button>
      <div class="barcode">
        <span style="width:2px"></span><span style="width:1px"></span><span style="width:3px"></span>
        <span style="width:1px"></span><span style="width:2px"></span><span style="width:1px"></span>
        <span style="width:3px"></span><span style="width:2px"></span><span style="width:1px"></span>
        <span style="width:1px"></span><span style="width:3px"></span><span style="width:1px"></span>
        <span style="width:2px"></span><span style="width:1px"></span><span style="width:2px"></span>
        <span style="width:3px"></span><span style="width:1px"></span><span style="width:2px"></span>
        <span style="width:1px"></span><span style="width:3px"></span><span style="width:1px"></span>
        <span style="width:2px"></span><span style="width:1px"></span><span style="width:1px"></span>
        <span style="width:3px"></span><span style="width:2px"></span>
      </div>
      <div class="barcode-num">4 820156 038241</div>
      <div class="timestamp">2026-03-18 14:32:07 | TXN #00847</div>

    <hr class="divider" style="margin: 0 1.5rem;">
    <section class="components">
      <h2>--- Components ---</h2>
      <div class="btn-row">
        <button class="btn btn-dark">Confirm</button>
        <button class="btn btn-outline">Void</button>

      </div>
      <div class="card">
        <h3>Transaction Log</h3>
        <p>Each receipt tells a story of exchange. Clean, minimal, and ephemeral by nature.</p>
      </div>
      <div class="input-group">
        <input type="text" placeholder="Enter item or SKU...">
      </div>
      <div class="palette">
        <div class="swatch" style="background:#2a2a2a"><span>#2A2A2A</span></div>
        <div class="swatch" style="background:#888"><span>#888888</span></div>
        <div class="swatch" style="background:#bbb"><span>#BBBBBB</span></div>
        <div class="swatch" style="background:#e8e4de"><span>#E8E4DE</span></div>
        <div class="swatch" style="background:#faf8f4"><span>#FAF8F4</span></div>
      </div>
      <div class="receipt-footer">*** END OF RECEIPT ***</div>
    </section>
  </div>
</div>
<div class="b-side">
<header class="bh"><div class="logo">RECEIPT</div><nav><a href="#">Home</a><a href="#">About</a><a href="#">Work</a><a href="#">Contact</a></nav></header>
<section class="bhero"><div class="bhero-inner"><p class="bhero-tag">THANK YOU</p><h1>Your Order<br>Summary.</h1><p>The mundane beauty of a thermal receipt. Monospace type, dashed dividers, narrow column.</p><div class="bhero-btns"><button class="bbtn bbtn-p">Print</button><button class="bbtn bbtn-s">Email</button></div></div></section>
<section class="bsec"><div class="bcon"><p class="bst">Features</p><h2 class="bsh">What Sets Us Apart</h2><div class="bgrid"><div class="bcard"><div class="bcard-icon">&#9670;</div><h3>Item A</h3><p>Design service ............ $99.00</p></div><div class="bcard"><div class="bcard-icon">&#9674;</div><h3>Item B</h3><p>Development .............. $149.00</p></div><div class="bcard"><div class="bcard-icon">&#10038;</div><h3>Item C</h3><p>Consultation ............... $49.00</p></div></div></div></section>

<section class="bsec"><div class="bcon"><div class="bquote"><blockquote>&ldquo;Thank you for your purchase. Please keep this receipt for your records.&rdquo;</blockquote><cite>&mdash; POS System</cite></div></div></section>
<footer class="bfoot"><div class="logo">RECEIPT</div><nav><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Contact</a></nav><small>&copy; 2026 RECEIPT. All rights reserved.</small></footer>
</div>
</body>
</html>
