<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flat Design - Sample</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Open Sans', sans-serif; background: #ECF0F1; color: #2C3E50; line-height: 1.5; }

  /* HERO */
  .hero {
    background: #3498DB;
    color: #FFF;
    padding: 1.5rem 2rem 3rem;
    min-height: 65vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3rem;
  }
  .logo {
    font-weight: 700;
    font-size: 1.2rem;
    background: #FFF;
    color: #3498DB;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; }
  .nav-links a { text-decoration: none; color: rgba(255,255,255,0.85); font-size: 0.9rem; font-weight: 600; }
  .nav-links a:hover { color: #FFF; }
  .hero-content { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 460px; }
  .hero-content h1 {
    font-size: 2.4rem;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 1rem;
  }
  .hero-content p {
    font-size: 1rem;
    opacity: 0.9;
    margin-bottom: 2rem;
    line-height: 1.6;
  }
  .hero-content button {
    align-self: flex-start;
    background: #F39C12;
    color: #FFF;
    border: none;
    padding: 0.8rem 2rem;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .hero-content button:hover { background: #E67E22; }

  .hero-shapes {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
  }
  .shape {
    width: 48px; height: 48px;
    border-radius: 4px;
  }
  .shape-1 { background: #2ECC71; }
  .shape-2 { background: #E74C3C; border-radius: 50%; }
  .shape-3 { background: #9B59B6; }
  .shape-4 { background: #F39C12; border-radius: 50%; width: 32px; height: 32px; align-self: flex-end; }

  /* COMPONENTS */
  .components {
    padding: 2rem;
  }
  .components > h2 {
    font-size: 1.2rem;
    font-weight: 700;
    color: #2C3E50;
    margin-bottom: 1.5rem;
  }
  .component-group { margin-bottom: 2rem; }
  .component-group h3 {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7F8C8D;
    margin-bottom: 0.75rem;
  }

  /* Buttons */
  .btn-primary, .btn-secondary, .btn-outline {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 0.6rem 1.4rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 0.5rem;
    transition: background 0.15s;
  }
  .btn-primary { background: #3498DB; color: #FFF; }
  .btn-primary:hover { background: #2980B9; }
  .btn-secondary { background: #2ECC71; color: #FFF; }
  .btn-secondary:hover { background: #27AE60; }
  .btn-outline { background: transparent; color: #3498DB; border: 2px solid #3498DB; }
  .btn-outline:hover { background: #3498DB; color: #FFF; }

  /* Card */
  .card {
    background: #FFF;
    border-radius: 4px;
    overflow: hidden;
    max-width: 320px;
  }
  .card-header {
    height: 120px;
    background: #E74C3C;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-header::after {
    content: '';
    width: 50px; height: 50px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
  }
  .card h4 {
    font-size: 1rem;
    font-weight: 700;
    padding: 1rem 1rem 0.3rem;
    color: #2C3E50;
  }
  .card p {
    font-size: 0.85rem;
    color: #7F8C8D;
    padding: 0 1rem 1rem;
    line-height: 1.5;
  }

  /* Input */
  .component-group input[type="text"] {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.7rem 1rem;
    border: 2px solid #BDC3C7;
    border-radius: 4px;
    outline: none;
    width: 100%;
    max-width: 320px;
    background: #FFF;
    transition: border-color 0.15s;
  }
  .component-group input[type="text"]:focus {
    border-color: #3498DB;
  }
  .component-group input[type="text"]::placeholder { color: #BDC3C7; }

  /* Palette */
  .palette { display: flex; gap: 0.5rem; }
  .swatch { width: 48px; height: 48px; border-radius: 4px; }
</style>
</head>
<body>
  <section class="hero">
    <nav>
      <div class="logo">F</div>
      <ul class="nav-links">
        <li><a href="#">Features</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Docs</a></li>
      </ul>
    </nav>
    <div class="hero-content">
      <h1>Design without the noise.</h1>
      <p>Flat design strips away decoration to put content first. Bold colors, clean lines, zero clutter.</p>
      <button>Get Started Free</button>
    </div>
    <div class="hero-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
  </section>

  <section class="components">
    <h2>Components</h2>

    <div class="component-group">
      <h3>Buttons</h3>
      <button class="btn-primary">Primary</button>
      <button class="btn-secondary">Secondary</button>
      <button class="btn-outline">Outline</button>
    </div>

    <div class="component-group">
      <h3>Card</h3>
      <div class="card">
        <div class="card-header"></div>
        <h4>Card Title</h4>
        <p>Card description text goes here with some details about this item.</p>
      </div>
    </div>

    <div class="component-group">
      <h3>Input</h3>
      <input type="text" placeholder="Enter something..." />
    </div>

    <div class="component-group">
      <h3>Palette</h3>
      <div class="palette">
        <div class="swatch" style="background:#3498DB"></div>
        <div class="swatch" style="background:#2ECC71"></div>
        <div class="swatch" style="background:#E74C3C"></div>
        <div class="swatch" style="background:#F39C12"></div>
        <div class="swatch" style="background:#9B59B6"></div>
      </div>
    </div>
  </section>
</body>
</html>
