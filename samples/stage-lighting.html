<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Lighting / Theatre</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@200;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --curtain: #6B0F1A; --gold: #D4A843; --deep: #120808; --spot-warm: #FFD700; --spot-blue: #4488CC; --velvet: #2A0A10; }
  body { font-family: 'Raleway', sans-serif; background: var(--deep); color: #F0E6D8; font-weight: 400; overflow-x: hidden; }
  .hero { position: relative; padding: 44px 28px 52px; text-align: center; overflow: hidden; background: linear-gradient(180deg, #1a0a0e, var(--deep)); }
  /* curtain drapes */
  .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 100%; background:
    linear-gradient(90deg, var(--curtain) 0%, rgba(107,15,26,.3) 10%, transparent 25%, transparent 75%, rgba(107,15,26,.3) 90%, var(--curtain) 100%);
    pointer-events: none; }
  /* spotlight */
  .hero::after { content: ''; position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 300px; height: 400px; background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,.12), rgba(255,215,0,.04) 40%, transparent 70%); pointer-events: none; clip-path: polygon(40% 0%, 60% 0%, 85% 100%, 15% 100%); }
  .hero nav { display: flex; justify-content: center; gap: 24px; font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; position: relative; z-index: 2; }
  .hero nav a { color: var(--gold); text-decoration: none; opacity: .6; transition: opacity .3s; }
  .hero nav a:hover { opacity: 1; }
  .stage-icon { width: 64px; height: 36px; margin: 0 auto 24px; border-bottom: 2px solid var(--gold); position: relative; z-index: 2; }
  .stage-icon::before { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; background: var(--spot-warm); border-radius: 50%; box-shadow: 0 0 20px var(--spot-warm), 0 0 40px rgba(255,215,0,.3); }
  h1 { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: #fff; margin-bottom: 8px; position: relative; z-index: 2; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  h1 em { font-weight: 400; color: var(--gold); }
  .subtitle { font-size: 12px; font-weight: 200; letter-spacing: 5px; text-transform: uppercase; color: rgba(240,230,216,.5); margin-bottom: 32px; position: relative; z-index: 2; }
  .cta { display: inline-block; padding: 12px 36px; border: 1px solid var(--gold); color: var(--gold); text-transform: uppercase; letter-spacing: 4px; font-size: 11px; font-family: inherit; font-weight: 600; background: transparent; cursor: pointer; position: relative; z-index: 2; transition: all .3s; }
  .cta:hover { background: var(--gold); color: var(--deep); box-shadow: 0 0 30px rgba(212,168,67,.3); }
  /* color gel washes */
  .gel-bar { height: 3px; background: linear-gradient(90deg, var(--curtain), var(--spot-warm), var(--spot-blue), var(--curtain)); }
  .components { padding: 32px 28px; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; opacity: .7; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  .btn { padding: 10px 22px; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold); transition: all .25s; }
  .btn:hover { background: var(--gold); color: var(--deep); }
  .btn.warm { border-color: var(--spot-warm); color: var(--spot-warm); background: rgba(255,215,0,.05); }
  .btn.warm:hover { background: var(--spot-warm); color: var(--deep); }
  .btn.filled { background: var(--curtain); border-color: var(--curtain); color: #F0E6D8; }
  .card { border: 1px solid rgba(212,168,67,.2); padding: 24px; margin-bottom: 28px; background: linear-gradient(135deg, rgba(42,10,16,.8), rgba(18,8,8,.9)); position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 80%; height: 100%; background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,.06), transparent 60%); pointer-events: none; }
  .card h3 { font-family: 'Playfair Display', serif; font-size: 18px; color: #fff; margin-bottom: 8px; position: relative; }
  .card p { font-size: 12px; color: rgba(240,230,216,.5); line-height: 1.7; position: relative; }
  .input-group { margin-bottom: 28px; }
  .input-group label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; opacity: .7; }
  .input-group input { width: 100%; padding: 12px 16px; background: rgba(42,10,16,.4); border: 1px solid rgba(212,168,67,.2); color: #F0E6D8; font-family: inherit; font-size: 13px; font-weight: 200; outline: none; transition: border-color .2s; }
  .input-group input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,168,67,.15); }
  .palette { display: flex; gap: 10px; }
  .swatch { width: 44px; height: 44px; position: relative; border: 1px solid rgba(212,168,67,.2); }
  .swatch span { position: absolute; bottom: -18px; left: 0; font-size: 8px; color: rgba(240,230,216,.3); }
  .swatch.s1 { background: var(--deep); }
  .swatch.s2 { background: var(--curtain); }
  .swatch.s3 { background: var(--gold); }
  .swatch.s4 { background: var(--spot-warm); }
  .swatch.s5 { background: var(--spot-blue); }
</style>
</head>
<body>
  <section class="hero">
    <nav>
      <a href="#">Programme</a>
      <a href="#">Cast</a>
      <a href="#">Tickets</a>
      <a href="#">Reviews</a>
    </nav>
    <div class="stage-icon"></div>
    <h1>The <em>Grand</em> Stage</h1>
    <p class="subtitle">A theatrical experience</p>
    <button class="cta">Book Seats</button>
  </section>
  <div class="gel-bar"></div>
  <section class="components">
    <p class="section-label">Buttons</p>
    <div class="btn-row">
      <button class="btn">Default</button>
      <button class="btn warm">Spotlight</button>
      <button class="btn filled">Curtain</button>
    </div>
    <p class="section-label">Card</p>
    <div class="card">
      <h3>Act I: Overture</h3>
      <p>The house lights dim. A single amber wash spills across the proscenium arch as the orchestra swells from the pit below.</p>
    </div>
    <p class="section-label">Input</p>
    <div class="input-group">
      <label>Guest Name</label>
      <input type="text" placeholder="Enter your name for the guest list...">
    </div>
    <p class="section-label">Color Palette</p>
    <div class="palette">
      <div class="swatch s1"><span>#120808</span></div>
      <div class="swatch s2"><span>#6B0F1A</span></div>
      <div class="swatch s3"><span>#D4A843</span></div>
      <div class="swatch s4"><span>#FFD700</span></div>
      <div class="swatch s5"><span>#4488CC</span></div>
    </div>
  </section>
</body>
</html>
